<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revistamento ZTO</title>
<meta name="theme-color" content="#043865">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ebf0f2; --card: #ffffff; --ink: #2b3a48; --title: #043865; --muted: #5f7180; --line: #d3dde3;
  --bar: #ffffff; --bar-ink: #043865;
  --primary: #043865; --primary-ink: #ffffff;
  --accent: #32a6e6; --accent-ink: #ffffff;
  --mark: #043865; --track: #e3eaee;
  --ok: #138a6c; --ok-bg: #e1f4ee; --bad: #c62828; --bad-bg: #fdeaea; --warn: #c45a12; --warn-bg: #fff0e5;
  --radius: 6px; --radius-sm: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #021a30; --card: #06294a; --ink: #e6eef5; --title: #ffffff; --muted: #9db3c6; --line: #16416a;
    --bar: #06294a; --bar-ink: #ffffff;
    --primary: #32a6e6; --primary-ink: #021a30;
    --mark: #32a6e6; --track: #0d3558;
    --ok: #4fd1a8; --ok-bg: #0c3a33; --bad: #ff7272; --bad-bg: #3d1a24; --warn: #f7a26b; --warn-bg: #3d2a1c;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Open Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

.proto { background: #fff3c4; color: #5a4300; font-size: 13px; padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.proto b { letter-spacing: .4px; }
.proto .seg { display: inline-flex; border: 1px solid #c9a227; border-radius: 999px; overflow: hidden; }
.proto .seg button { border: 0; background: transparent; padding: 4px 12px; font-weight: 700; font-size: 13px; cursor: pointer; color: #5a4300; }
.proto .seg button.on { background: #5a4300; color: #fff3c4; }
.proto select { font-size: 13px; padding: 2px 6px; border-radius: 4px; border: 1px solid #c9a227; background: #fffaf0; color: #5a4300; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
.top-linha { display: flex; align-items: center; gap: 10px; max-width: 1180px; margin: 0 auto; }
header.top .logo { height: 20px; width: auto; color: var(--title); flex: none; }
header.top .divisor { width: 1px; height: 28px; background: var(--line); }
header.top h1 { font-size: 18px; margin: 0; font-weight: 800; line-height: 1.15; }
header.top .sub { font-size: 12px; color: var(--muted); font-weight: 600; display: block; text-transform: uppercase; letter-spacing: .5px; }
header.top .quem { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }
header.top .quem b { display: block; color: var(--title); font-size: 14px; }
nav.tabs { display: flex; gap: 2px; max-width: 1180px; margin: 8px auto 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button.on { color: var(--title); border-bottom-color: var(--accent); }
nav.tabs .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; }

main { padding: 14px 16px 40px; max-width: 1180px; margin: 0 auto; }
main.estreito { max-width: 620px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
.grid .larga { grid-column: 1 / -1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; min-width: 0; }
.grid .card { margin-bottom: 0; }
.card h2 { font-size: 13px; margin: 0 0 10px; color: var(--title); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .dir { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nota { font-size: 13px; color: var(--muted); background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: var(--radius-sm); margin: 0 0 12px; }
.faixa-turno { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin: 0 0 12px; }
.faixa-turno h2 { margin: 0; font-size: 20px; color: var(--title); font-weight: 800; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--card); color: var(--title); font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.big { width: 100%; min-height: 58px; font-size: 17px; }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

label.campo { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
label.campo input, label.campo select, label.campo textarea { display: block; width: 100%; margin-top: 4px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); font-size: 16px; font-weight: 400; color: var(--ink); }
label.campo textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.linha-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 10px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.neu { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

/* progresso */
.prog { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--mark); border-radius: 0 4px 4px 0; }
.grande { font-size: 34px; font-weight: 800; color: var(--title); line-height: 1; }
.dupla-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.dupla-linha .prog { grid-column: 1 / -1; }
.dupla-linha .nome { font-weight: 700; color: var(--title); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .r { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.kpi .v { font-size: 28px; font-weight: 800; color: var(--title); line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--muted); }

/* barras horizontais (série única) */
.hb { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.hb .l { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .t { height: 14px; position: relative; }
.hb .t i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mark); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .n { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.hb .hit { display: contents; }

/* tabelas */
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tabela td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabela td.num, .tabela th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabela tr.click { cursor: pointer; }
.tabela tr.click:hover td { background: var(--bg); }
.rolagem { overflow-x: auto; }
.tabela input { width: 70px; min-height: 36px; padding: 4px 6px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }

/* lista de vagões (técnico) */
.vagoes { display: flex; flex-direction: column; gap: 6px; }
.vg { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; min-height: 58px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.vg .pos { font-size: 20px; font-weight: 800; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.vg .cod { font-weight: 700; color: var(--title); font-size: 16px; }
.vg .det { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vg.feito { opacity: .78; }

.feed { list-style: none; padding: 0; margin: 0; }
.feed li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
.feed li:first-child { border-top: 0; }
.feed .h { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(2, 20, 40, .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.modal[hidden] { display: none; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 12px 12px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 10px; } }
.sheet h3 { margin: 0; color: var(--title); font-size: 20px; }
.sheet .fechar { float: right; background: none; border: 0; font-size: 28px; line-height: 1; color: var(--muted); cursor: pointer; }
.escolhas { display: grid; gap: 8px; margin: 14px 0; }
.def-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 8px 10px; background: var(--bad-bg); border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 14px; }
.def-item button { background: none; border: 0; color: var(--bad); font-weight: 700; cursor: pointer; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.stepper button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; font-weight: 700; color: var(--title); cursor: pointer; }
.stepper span { min-width: 34px; text-align: center; font-weight: 800; font-size: 18px; }
.radio { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer; }

.arvore details { border-top: 1px solid var(--line); padding: 6px 0; }
.arvore summary { cursor: pointer; font-weight: 700; color: var(--title); }
.arvore ul { margin: 6px 0 6px 4px; padding-left: 18px; font-size: 14px; }

.tt { position: fixed; z-index: 30; pointer-events: none; background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.18); border-radius: var(--radius-sm); padding: 6px 9px; font-size: 13px; max-width: 260px; }
.tt[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: var(--primary); color: var(--primary-ink); padding: 12px 18px; border-radius: var(--radius); font-weight: 700; z-index: 40; transition: transform .25s, opacity .25s; opacity: 0; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }

/* v0.3 */
:root { --info: #0b6fa8; --info-bg: #e3f2fb; --heat: 4, 56, 101; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --info: #7cc8f2; --info-bg: #0d3a5c; --heat: 50, 166, 230; } }
.tag.info { background: var(--info-bg); color: var(--info); }
.alerta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--warn-bg); color: var(--warn); border-radius: var(--radius-sm); padding: 8px 10px; margin: 10px 0 2px; font-size: 14px; }
.secao { font-size: 13px; font-weight: 800; color: var(--title); text-transform: uppercase; letter-spacing: .5px; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grade-sap { display: grid; grid-template-columns: 28px repeat(4, 1fr); gap: 6px; align-items: center; margin-bottom: 4px; }
.grade-sap > b { text-align: center; font-size: 13px; color: var(--muted); }
.pos-btn { min-height: 52px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--muted); font-weight: 800; font-size: 16px; cursor: pointer; }
.pos-btn.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.grade-sap.leitura .cel { min-height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: rgba(var(--heat), var(--a)); color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.45); }
.radio.marcado { border-color: var(--bad); background: var(--bad-bg); }
.resumo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
.resumo div { background: var(--bg); border-radius: var(--radius-sm); padding: 8px; text-align: center; }
.resumo b { display: block; font-size: 22px; color: var(--title); }
.resumo span { font-size: 11px; color: var(--muted); font-weight: 700; }
.inp { flex: 1; min-width: 0; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); font-size: 16px; }
.sel-p { min-height: 40px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); max-width: 100%; }
.filtros { align-items: center; }
.ev-bad b:first-child { color: var(--bad); }
.tabela td b { white-space: nowrap; }
.upload { display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px dashed var(--accent); border-radius: var(--radius); background: var(--bg); cursor: pointer; margin-bottom: 10px; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload .ic { font-size: 28px; }
.upload b { color: var(--title); }
.upload.lendo { opacity: .6; pointer-events: none; }
.escala { border-collapse: separate; border-spacing: 3px; font-size: 13px; }
.escala th { font-size: 12px; color: var(--muted); font-weight: 700; padding: 2px 4px; text-align: center; white-space: nowrap; }
.escala th span { font-weight: 600; font-size: 11px; }
.escala th.hoje { color: var(--title); }
.escala td { width: 34px; height: 30px; text-align: center; font-weight: 800; border-radius: 4px; }
.escala td.e6 { background: #fff3c4; color: #5a4300; } .escala td.e14 { background: #e3f2fb; color: #0b6fa8; } .escala td.e22 { background: #043865; color: #fff; }
.escala td.eR, .escala td.eF { background: var(--bg); color: var(--muted); }
.escala td.hoje { box-shadow: inset 0 0 0 1px var(--muted); }
.escala td.agora { box-shadow: 0 0 0 3px var(--accent); }
.ap.conferido { opacity: .7; }
@media (max-width: 520px) { .proto .seg button { padding: 4px 8px; font-size: 12px; } }
.ficha-ok { background: var(--ok-bg); border-radius: var(--radius-sm); padding: 10px; }
@media (max-width: 520px) { .resumo { grid-template-columns: repeat(2, 1fr); } }

/* app real */
.barra-prog { background: #fff3c4; color: #5a4300; font-size: 13px; padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.barra-prog[hidden] { display: none; }
.barra-prog .seg { display: inline-flex; border: 1px solid #c9a227; border-radius: 999px; overflow: hidden; }
.barra-prog .seg button { border: 0; background: transparent; padding: 4px 10px; font-weight: 700; font-size: 13px; cursor: pointer; color: #5a4300; }
.barra-prog .seg button.on { background: #5a4300; color: #fff3c4; }
.barra-prog select { font-size: 13px; padding: 2px 6px; border-radius: 4px; border: 1px solid #c9a227; background: #fffaf0; color: #5a4300; max-width: 210px; }
.topo-acoes { display: flex; align-items: center; gap: 8px; margin-left: 12px; }
.sinc { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--bg); color: var(--title); border: 1px solid var(--line); white-space: nowrap; cursor: pointer; }
.sinc.off, .sinc.erro { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.sair { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
#tela-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
#tela-login[hidden], #tela-app[hidden] { display: none; }
.login { width: 100%; max-width: 400px; }
.login .marca { text-align: center; margin-bottom: 18px; color: var(--title); }
.login .marca .logo { height: 40px; width: auto; }
.login .marca div { font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.erro-login { color: var(--bad); font-weight: 700; font-size: 14px; margin: 0 0 10px; }
@media (max-width: 560px) { header.top .quem, header.top .sub, header.top .divisor { display: none; } header.top h1 { font-size: 15px; } .topo-acoes { margin-left: auto; gap: 6px; } .sinc { padding: 4px 7px; font-size: 11px; } }
@media (max-width: 520px) { .barra-prog .seg button { padding: 4px 7px; font-size: 12px; } }
/* indicadores do programador (v1.1) */
:root { --s1: #1b5fa8; --s2: #2ea3e3; --s3: #1f8a6a; --meta: #c62828; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #5b7fe8; --s2: #14a8ad; --s3: #239a74; --meta: #ff7272; } }
.filtros-bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; margin-bottom: 12px; }
.filtro { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; min-width: 0; }
.filtro select { min-height: 38px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; max-width: 200px; }
.filtro-acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
@media (max-width: 560px) { .filtro { flex: 1 1 calc(50% - 10px); } .filtro select { max-width: none; width: 100%; } .filtro-acoes { margin-left: 0; } }
.rol-x { overflow-x: auto; padding-top: 4px; }
.plot { position: relative; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--line); }
.plot .c { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.plot .c i { display: block; width: min(72%, 30px); min-height: 2px; border-radius: 4px 4px 0 0; }
.plot .c .v { font-size: 11px; font-weight: 700; color: var(--ink); white-space: nowrap; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.xs { display: flex; gap: 4px; margin-top: 4px; }
.xs span { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.xs.solto span { overflow: visible; }
.xs b { display: block; color: var(--ink); font-variant-numeric: tabular-nums; }
.meta { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--meta); z-index: 1; pointer-events: none; }
.meta span { position: absolute; right: 0; bottom: 2px; font-size: 11px; font-weight: 700; color: var(--meta); background: var(--card); padding: 0 4px; border-radius: 3px; }
.linhas { position: relative; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }

  else q = op.acao === 'delete' ? q.delete() : q.update(op.dados);
  for (const [col, opr, val] of op.filtro || []) q = q[opr](col, val);

// ---------- leitura da ficha do trem (PDF do Translogic ou texto colado) ----------
// Linha de veículo: "2 PCT 057312-4 L 545 ZPG TRO ... 26,8 7l-10" -> posição, série, número e faixa de eixos.
// Veículos com mais de 4 eixos (locomotivas) são ignorados.
function lerFichaTexto(linhas) {
  const f = { prefixo: '', declarados: null, vagoes: [], ignorados: [], restr: {} };
  let emRestr = false;
  for (const l0 of linhas) {
    const l = l0.replace(/\s+/g, ' ').trim(); let m;
    if (!f.prefixo && (m = l.match(/Prefixo:\s*([A-Z0-9]+)/i))) f.prefixo = m[1].toUpperCase();
    if (f.declarados == null && (m = l.match(/^Vag[õo]es:\s*(\d+)/i))) f.declarados = +m[1];
    if (/Ve[íi]culos com Restri/i.test(l)) { emRestr = true; continue; }
    if (emRestr) {
      if ((m = l.match(/^(\d+) ([A-Z]{3}) (\d{6}-\d) (.+?) (\d{2}\/\d{2})\/\d{4}/))) {
        let mot = m[4].replace(/^[^ -]+-/, '').trim(); const w = mot.split(' '), h = w.length / 2;
        if (w.length % 2 === 0 && w.slice(0, h).join(' ') === w.slice(h).join(' ')) mot = w.slice(0, h).join(' ');
        f.restr[m[2] + ' ' + m[3]] = { pos: +m[1], motivo: mot, data: m[5] };
      }
      continue;
    }
    if ((m = l.match(/^(\d+) ([A-Z][A-Z0-9]{1,3}) (\d{4,6}-\d)\b.*?\s(\d+)\s*[lI|]?\s*-\s*(\d+)$/))) {
      const eixos = +m[5] - +m[4] + 1, v = { pos: +m[1], cod: m[2] + ' ' + m[3], eixos };
      (eixos > 4 ? f.ignorados : f.vagoes).push(v);
    }
  }
  return f;
}
let pdfjsPronto = null;
function carregarPdfJs() {

    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(); };
    sc.onerror = () => { pdfjsPronto = null; erro(new Error('Sem internet para abrir o leitor de PDF')); };

async function linhasDoPdf(arquivo) {
  await carregarPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await arquivo.arrayBuffer() }).promise, linhas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const tc = await (await pdf.getPage(n)).getTextContent(), rows = [];
    tc.items.forEach(it => {
      if (!it.str.trim()) return;
      const y = it.transform[5]; let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) rows.push(row = { y, itens: [] });
      row.itens.push({ x: it.transform[4], s: it.str });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => linhas.push(r.itens.sort((a, b) => a.x - b.x).map(i => i.s).join(' ')));
  }
  return linhas;
}

// histórico resumido: uma linha por trem, somada no servidor (03-indicadores.sql); renova a cada 5 min
async function carregarHist() {

      tudo(() => sb.from('resumo_materiais').select('*')),
      tudo(() => sb.from('registros').select('trem_id,vagao,obs').contains('ocorrencias', ['Retenção de vagão'])),
      tudo(() => sb.from('trens_historico').select('id,materiais')).catch(() => [])          // vagões e posições lidos do Forms

    Object.assign(HIST, { trens, mats, ret, det: Object.fromEntries(det.map(x => [x.id, x.materiais])), em: Date.now(), ok: true });

}
// planilha "Planos Especiais 2026": última carga enviada (05-planos-especiais.sql)
async function carregarPlanosExt() {

    if (error || !c?.length) return error ? null : { carga: null, rows: [] };

let xlsxPronto = null;
function carregarXlsx() {

    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

// '8400946HPT' -> 'HPT 840094-6' (mesmo formato da ficha do trem)
function codVagaoPlanilha(v) {
  const t = String(v || '').toUpperCase().replace(/\s+/g, '');
  let m = t.match(/^(\d{6})(\d)([A-Z]{3})$/); if (m) return `${m[3]} ${m[1]}-${m[2]}`;
  m = t.match(/^([A-Z]{3})-?(\d{6})-?(\d)$/); if (m) return `${m[1]} ${m[2]}-${m[3]}`;
  return String(v || '').trim().toUpperCase();
}
async function enviarPlanilhaPlanos(arq) {
  await carregarXlsx();
  const wb = XLSX.read(await arq.arrayBuffer(), { type: 'array', cellDates: true });
  const sem = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const nomeAba = wb.SheetNames.find(n => sem(n).includes('base vagoes')) || wb.SheetNames.find(n => { const l = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, range: 0 })[0] || []; return l.some(c => sem(c) === 'vagao') && l.some(c => sem(c) === 'plano'); });
  if (!nomeAba) throw new Error('Não achei a aba "Base Vagões - Planos" (colunas VAGÃO e Plano)');
  const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { defval: null });
  const col = (l, nome) => { const k = Object.keys(l).find(k => sem(k) === nome); return k ? l[k] : null; };
  const vazio = v => v == null || /^(\s*|#N\/A|0)$/i.test(String(v).trim());
  const dataISO = v => v instanceof Date && !isNaN(v) ? isoData(new Date(v.getTime() + 12 * 3600e3)) : null;   // meio-dia: evita virar o dia pelo fuso
  const porChaveV = new Map();
  linhas.forEach(l => {
    const vagao = codVagaoPlanilha(col(l, 'vagao')), plano = String(col(l, 'plano') || '').trim();
    if (!vagao || !plano) return;
    const prev = col(l, 'previsao');
    porChaveV.set(vagao + '|' + plano, { vagao, plano, data_inspecao: dataISO(col(l, 'data inspecao')), prioridade: col(l, 'prioridade') || null, rodeiro: vazio(col(l, 'rodeiro')) ? null : String(col(l, 'rodeiro')),
      trem: vazio(col(l, 'trem')) ? null : String(col(l, 'trem')).trim(), os: vazio(col(l, 'os')) ? null : String(col(l, 'os')), posicao: vazio(col(l, 'posicao')) ? null : +col(l, 'posicao') || null,
      local: col(l, 'local') || null, previsao: prev instanceof Date && !isNaN(prev) ? prev.toISOString() : null });
  });
  const dados = [...porChaveV.values()];
  if (!dados.length) throw new Error('A aba "' + nomeAba + '" não tem vagões com plano');
  const { data: c, error: e1 } = await sb.from('planos_cargas').insert({ arquivo: arq.name, linhas: dados.length }).select().single();
  if (e1) throw new Error(/relation|does not exist|schema cache/i.test(e1.message) ? 'Rode o 05-planos-especiais.sql no Supabase' : e1.message);
  for (let i = 0; i < dados.length; i += 500) {
    toast(`Enviando planilha… ${Math.min(i + 500, dados.length)} de ${dados.length}`);
    const { error } = await sb.from('planos_vagoes').insert(dados.slice(i, i + 500).map(d => ({ ...d, carga_id: c.id })));
    if (error) { await sb.from('planos_cargas').delete().eq('id', c.id); throw new Error(error.message); }
  }
  await sb.from('planos_cargas').delete().neq('id', c.id);                          // fica só a carga nova
  HIST.planos = await carregarPlanosExt();
  await carregarPendentes(true);
  return dados.length;
}

function periodoDe(per) {                                 // -> [início, fim, nome]

  const [y, m] = per.slice(4).split('-').map(Number);

}

const legenda = series => `<div class="leg">${series.map(s => `<span><i class="${s.tr ? 'tr' : ''}" style="${s.tr ? 'border-color' : 'background'}:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`;

function linhas(itens, series, { meta, rotMeta = '', fmtV = fmt, alt = 170, larg = 22, max } = {}) {

function gauge(v, { meta, max, txt, rotMeta = '', cor = 'var(--s1)' }) {

    acc += len; return s; }).join('');

    case 'plano-reabrir': {
      const p = DB.planos.find(x => x.id === el.dataset.id), c = ($('coment-' + p.id)?.value || '').trim(); if (!c) { toast('Escreva o motivo para reabrir'); return; }
      Object.assign(p, { status: 'reaberta', coment: c }); enviar({ tabela: 'planos', acao: 'update', dados: { status: 'reaberta', comentario: c }, filtro: [['id', 'eq', p.id]], desc: 'Plano especial' }); toast('Plano reaberto para a equipe'); break;
    }
    case 'esp-filtro': S.espFiltro = v; break;
    case 'validar-trem': S.valTrem = el.dataset.id; break;
    case 'val-voltar': S.valTrem = null; break;
    case 'val-ok': { const t = tremQualquer(el.dataset.id), p = +el.dataset.p; Object.assign(t.reg[p], { val: 'ok', valPor: DB.me.nome }); enviar({ tabela: 'registros', acao: 'update', dados: { val: 'ok' }, filtro: [['trem_id', 'eq', t.id], ['posicao', 'eq', p]], desc: 'Validação' }); break; }
    case 'val-todos': {
      const t = tremQualquer(el.dataset.id), ps = apontamentos(t).filter(x => !x.r.val).map(x => x.p);
      ps.forEach(p => Object.assign(t.reg[p], { val: 'ok', valPor: DB.me.nome }));
      enviar({ tabela: 'registros', acao: 'update', dados: { val: 'ok' }, filtro: [['trem_id', 'eq', t.id], ['posicao', 'in', ps]], desc: 'Validação' }); toast('Apontamentos validados'); break;
    }
    case 'val-corrigir': abrirVagao(+el.dataset.p, el.dataset.id, true); return;
    case 'val-concluir': {
      const t = tremQualquer(el.dataset.id), parecer = ($('parecer')?.value || '').trim();
      t.validacao = { status: 'validado', por: DB.me.nome, em: new Date().toISOString(), parecer, corrigidos: apontamentos(t).filter(x => x.r.val === 'corrigido').length };
      enviar({ tabela: 'trens', acao: 'update', dados: { validacao: 'validado', parecer: parecer || null }, filtro: [['id', 'eq', t.id]], desc: 'Validação do trem ' + t.prefixo });
      S.valTrem = null; toast('Trem ' + t.prefixo + ' validado'); break;
    }
    case 'exportar': exportar(v); return;
    case 'ver-vagao': e.preventDefault(); S.busca = v; S.papel = 'prog'; S.aba.prog = 'vagao'; break;
    case 'buscar': S.busca = $('busca').value; break;
    default: return;
  }
  render();
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, N = S.novo, M = S.modal;
  if (a === 'f') { F[el.dataset.k] = el.value; render(); }
  else if (a === 'planos-xlsx') {
    const arq = el.files[0]; if (!arq) return;
    S.enviandoPlanos = true; render();
    try { const n = await enviarPlanilhaPlanos(arq); toast('Planilha de planos atualizada: ' + fmt(n) + ' vagões'); }
    catch (err) { toast('⚠ ' + err.message); }
    S.enviandoPlanos = false; render();
  }
  else if (a === 'turno-ver') { S.turnoVer = el.value; S.planoTurno = el.value; S.novo = novoVazio(); S.valTrem = null; render(); }
  else if (a === 'ver-tec') { S.verTec = el.value; S.tecTrem = null; render(); }
  else if (a === 'plano-turno') { S.planoTurno = el.value; render(); }
  else if (a === 'novo-campo') { N[el.dataset.k] = el.value; if (el.dataset.k === 'texto') { N.lidos = null; N.dist = null; } render(); }
  else if (a === 'dist-fim') {
    const k = +el.dataset.k, d = N.dist;
    let v = +el.value || 0; if (N.posFicha) { const i = N.posFicha.findIndex(x => x >= v); v = i < 0 ? N.lidos.length : i + 1; }
    d[k].fim = Math.max(d[k].ini, Math.min(v || d[k].ini, N.lidos.length - (d.length - 1 - k)));
    for (let j = k + 1; j < d.length; j++) { d[j].ini = d[j - 1].fim + 1; d[j].fim = j < d.length - 1 ? Math.max(d[j].ini, d[j].fim) : N.lidos.length; }
    render();
  }
  else if (a === 'membro') { const tt = T(), eq = EQ(tt)[+el.dataset.i], j = +el.dataset.j; if (el.value) eq.membros[j] = el.value; else eq.membros.splice(j, 1); eq.membros = eq.membros.filter(Boolean); S.eqSujo[tt] = true; S.novo = novoVazio(); render(); }
  else if (a === 'ficha-pdf') {
    const arq = el.files[0]; if (!arq) return;
    N.lendo = true; render();
    linhasDoPdf(arq).then(l => { N.lendo = false; if (aplicarFicha(lerFichaTexto(l), arq.name)) toast('Ficha lida: ' + N.lidos.length + ' vagões'); render(); })
      .catch(err => { N.lendo = false; toast('Não consegui ler o PDF: ' + err.message); render(); });
  }
  else if (a === 'backup') { S.backup = el.value.trim(); lsGravar('rzto_backup', S.backup); }
  else if (a === 'novo-mat') { lerCampos(); M.novoMat = el.value; M.novoQtd = 1; renderModal(); }
  else if (a === 'mot-parcial') { lerCampos(); M.motivoParcial = el.value; renderModal(); }
  else if (a === 'arv') { lerCampos(); const n = M.arv, k = el.dataset.k, ordem = ['sis', 'sub', 'comp', 'falha']; n[k] = el.value; ordem.slice(ordem.indexOf(k) + 1).forEach(x => n[x] = ''); renderModal(); }
  else if (a === 'foto') { lerCampos(); const f = el.files[0]; if (!f) return; try { M.foto = await reduzirFoto(f); } catch { toast('Não consegui ler a foto'); } renderModal(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'busca-falha') return;
  const q = semAcento(e.target.value.trim());
  const res = q.length < 2 ? [] : FOLHAS.map((f, i) => [f, i]).filter(([f]) => q.split(' ').every(w => semAcento(f.comp + ' ' + f.falha + ' ' + f.sub + ' ' + f.sis).includes(w))).slice(0, 8);
  $('res-falha').innerHTML = res.map(([f, i]) => `<button class="btn" style="justify-content:flex-start;text-align:left;min-height:52px;font-weight:600;padding:6px 12px" data-act="escolher-falha" data-i="${i}"><span><b>${esc(f.comp)}: ${esc(f.falha)}</b><br><span class="small muted">${esc(f.sis)} › ${esc(f.sub)}</span></span></button>`).join('');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'busca') { S.busca = e.target.value; render(); }
  if (e.key === 'Escape' && S.modal) { S.modal = null; renderModal(); }
});
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]'), tt = $('tt');
  if (!el) { tt.hidden = true; return; }
  tt.textContent = el.dataset.tip; tt.hidden = false;
  tt.style.left = Math.min(e.clientX + 14, innerWidth - tt.offsetWidth - 8) + 'px'; tt.style.top = (e.clientY + 16) + 'px';
});
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && DB.me) { DB.me = null; telaLogin('Sua sessão terminou. Entre de novo.'); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

entrar();

</script>
